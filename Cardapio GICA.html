<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GICA Sabores</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --cream: #FDF6EC;
    --warm: #FFF9F2;
    --gold: #C8933A;
    --gold-light: #E8B86D;
    --brown: #5C3D1E;
    --brown-dark: #3A2410;
    --muted: #8A6A4A;
    --green-wa: #25D366;
    --green-wa-dark: #128C7E;
    --radius: 16px;
    --shadow: 0 4px 24px rgba(58,36,16,0.10);
  }

  body {
    background: var(--cream);
    font-family: 'Nunito', sans-serif;
    color: var(--brown-dark);
    min-height: 100vh;
    padding-bottom: 120px;
  }

  /* ── HERO ── */
  .hero {
    background: linear-gradient(135deg, var(--brown-dark) 0%, var(--brown) 100%);
    padding: 28px 20px 24px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .hero::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 70% 50%, rgba(200,147,58,0.18) 0%, transparent 65%);
  }
  .hero-badge { display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: var(--gold-light); opacity: 0.8; margin-bottom: 8px; }
  .hero-title { font-family: 'Playfair Display', serif; font-size: 52px; font-weight: 900; line-height: 0.9; color: #fff; position: relative; }
  .hero-sub { font-family: 'Playfair Display', serif; font-style: italic; font-size: 20px; color: var(--gold-light); margin-top: 4px; position: relative; }
  .hero-tagline { font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: rgba(255,255,255,0.45); margin-top: 12px; position: relative; }

  /* ── NAV TABS ── */
  .nav-tabs {
    display: flex;
    gap: 8px;
    padding: 12px 16px;
    overflow-x: auto;
    background: var(--warm);
    border-bottom: 1px solid rgba(200,147,58,0.15);
    scrollbar-width: none;
    position: sticky;
    top: 0;
    z-index: 10;
    box-shadow: 0 2px 12px rgba(58,36,16,0.07);
  }
  .nav-tabs::-webkit-scrollbar { display: none; }
  .tab-btn {
    flex-shrink: 0;
    padding: 7px 16px;
    border-radius: 999px;
    border: 1.5px solid rgba(200,147,58,0.3);
    background: transparent;
    font-family: 'Nunito', sans-serif;
    font-size: 13px;
    font-weight: 700;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.2s ease;
    white-space: nowrap;
  }
  .tab-btn.active { background: var(--brown); border-color: var(--brown); color: #fff; }
  .tab-btn:hover:not(.active) { border-color: var(--gold); color: var(--brown); }

  /* ── CONTENT ── */
  .content { max-width: 680px; margin: 0 auto; padding: 20px 16px; }
  .section-block { margin-bottom: 28px; }
  .section-label { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .section-label span { font-family: 'Playfair Display', serif; font-size: 20px; font-weight: 700; color: var(--brown); }
  .section-label hr { flex: 1; border: none; height: 1px; background: linear-gradient(to right, rgba(200,147,58,0.4), transparent); }

  /* ── PRODUCT CARDS ── */
  .products-list { display: flex; flex-direction: column; gap: 10px; }

  .product-card {
    background: var(--warm);
    border: 1.5px solid rgba(200,147,58,0.15);
    border-radius: var(--radius);
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 14px;
    cursor: pointer;
    transition: all 0.2s ease;
    position: relative;
    overflow: hidden;
  }
  .product-card:hover { border-color: var(--gold); box-shadow: var(--shadow); transform: translateY(-1px); }
  .product-card.in-cart { border-color: var(--gold); background: #fffbf4; }

  .product-thumb {
    width: 72px; height: 72px;
    border-radius: 12px;
    flex-shrink: 0;
    background: linear-gradient(135deg, #e8d5b7, #c9a87c);
    display: flex; align-items: center; justify-content: center;
    font-size: 30px;
  }

  .product-info { flex: 1; min-width: 0; }
  .product-name { font-family: 'Playfair Display', serif; font-size: 15px; font-weight: 700; color: var(--brown-dark); margin-bottom: 3px; }
  .product-desc { font-size: 12px; color: var(--muted); line-height: 1.4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .product-price-row { display: flex; align-items: center; gap: 8px; margin-top: 5px; flex-wrap: wrap; }
  .product-price { font-family: 'Playfair Display', serif; font-size: 16px; font-weight: 700; color: var(--gold); }
  .product-subtotal {
    font-size: 12px;
    font-weight: 700;
    color: #fff;
    background: var(--brown);
    border-radius: 999px;
    padding: 2px 9px;
    display: none;
    animation: popIn 0.2s ease;
  }
  .product-subtotal.show { display: inline-block; }
  @keyframes popIn { from { transform: scale(0.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  .product-action { flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; }

  .qty-controls { display: flex; align-items: center; gap: 6px; }
  .qty-btn {
    width: 28px; height: 28px;
    border-radius: 50%;
    border: 2px solid var(--gold);
    background: transparent;
    color: var(--gold);
    font-size: 18px; font-weight: 700;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s; line-height: 1;
  }
  .qty-btn:hover { background: var(--gold); color: #fff; }
  .qty-num { font-size: 15px; font-weight: 800; color: var(--brown-dark); min-width: 18px; text-align: center; }

  .add-btn {
    width: 32px; height: 32px;
    border-radius: 50%; border: none;
    background: var(--gold); color: #fff;
    font-size: 22px; font-weight: 700;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
    box-shadow: 0 2px 8px rgba(200,147,58,0.4);
  }
  .add-btn:hover { background: var(--brown); transform: scale(1.1); }

  /* ── MODAL PRODUTO ── */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.55);
    z-index: 100;
    display: flex; align-items: flex-end; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity 0.3s ease;
  }
  .modal-overlay.open { opacity: 1; pointer-events: all; }
  .modal {
    background: var(--warm);
    border-radius: 24px 24px 0 0;
    width: 100%; max-width: 680px;
    max-height: 88vh; overflow-y: auto;
    transform: translateY(100%);
    transition: transform 0.35s cubic-bezier(0.34, 1.1, 0.64, 1);
    scrollbar-width: none;
  }
  .modal::-webkit-scrollbar { display: none; }
  .modal-overlay.open .modal { transform: translateY(0); }

  .modal-img {
    width: 100%; height: 220px;
    background: linear-gradient(135deg, #e8d5b7, #c9a87c);
    display: flex; align-items: center; justify-content: center;
    font-size: 80px;
  }
  .modal-wrapper { position: relative; }
  .modal-close {
    position: absolute; top: 12px; right: 16px;
    width: 34px; height: 34px;
    border-radius: 50%;
    background: rgba(0,0,0,0.35);
    border: none; color: #fff; font-size: 18px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .modal-body { padding: 24px 20px 32px; }
  .modal-name { font-family: 'Playfair Display', serif; font-size: 22px; font-weight: 900; color: var(--brown-dark); margin-bottom: 8px; }
  .modal-desc { font-size: 14px; color: var(--muted); line-height: 1.6; margin-bottom: 16px; }
  .modal-price-row { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .modal-price { font-family: 'Playfair Display', serif; font-size: 26px; font-weight: 700; color: var(--gold); }
  .modal-subtotal-badge {
    font-size: 13px; font-weight: 800;
    background: var(--brown); color: #fff;
    border-radius: 999px; padding: 4px 14px;
    display: none;
  }
  .modal-subtotal-badge.show { display: inline-block; }

  .modal-qty-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .modal-qty-controls {
    display: flex; align-items: center; gap: 14px;
    background: #f5ede0; border-radius: 999px; padding: 8px 18px;
  }
  .modal-qty-btn {
    width: 32px; height: 32px; border-radius: 50%;
    border: 2px solid var(--gold); background: transparent; color: var(--gold);
    font-size: 20px; font-weight: 700; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
  }
  .modal-qty-btn:hover { background: var(--gold); color: #fff; }
  .modal-qty-num { font-size: 18px; font-weight: 800; min-width: 24px; text-align: center; }

  .modal-add-btn {
    flex: 1; padding: 14px; border-radius: 14px; border: none;
    background: var(--brown); color: #fff;
    font-family: 'Nunito', sans-serif; font-size: 15px; font-weight: 800;
    cursor: pointer; transition: all 0.2s;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .modal-add-btn:hover { background: var(--brown-dark); transform: scale(1.02); }

  /* ── CART FAB ── */
  .cart-fab {
    position: fixed; bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--brown); color: #fff;
    border: none; border-radius: 999px;
    padding: 14px 28px;
    font-family: 'Nunito', sans-serif; font-size: 15px; font-weight: 800;
    cursor: pointer;
    display: flex; align-items: center; gap: 12px;
    box-shadow: 0 8px 32px rgba(58,36,16,0.35);
    transition: all 0.25s ease;
    z-index: 50; white-space: nowrap;
    opacity: 0; pointer-events: none;
  }
  .cart-fab.visible { opacity: 1; pointer-events: all; transform: translateX(-50%) translateY(0); }
  .cart-fab:hover { background: var(--brown-dark); }
  .cart-fab-inner { display: flex; flex-direction: column; align-items: flex-start; }
  .cart-fab-label { font-size: 13px; font-weight: 700; }
  .cart-fab-total { font-size: 16px; font-weight: 800; color: var(--gold-light); }
  .cart-count {
    background: var(--gold); color: #fff;
    border-radius: 999px; padding: 2px 9px;
    font-size: 13px; font-weight: 800;
  }

  /* ── CART MODAL ── */
  .cart-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .cart-title { font-family: 'Playfair Display', serif; font-size: 20px; font-weight: 700; color: var(--brown-dark); }
  .cart-close-btn {
    width: 34px; height: 34px; border-radius: 50%;
    background: #f0e6d4; border: none; color: var(--muted);
    font-size: 18px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }

  .cart-item {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid rgba(200,147,58,0.12);
  }
  .cart-item-info { flex: 1; }
  .cart-item-name { font-weight: 700; font-size: 14px; color: var(--brown-dark); }
  .cart-item-sub { font-size: 12px; color: var(--muted); }
  .cart-item-price { font-family: 'Playfair Display', serif; font-weight: 700; color: var(--gold); font-size: 15px; white-space: nowrap; }
  .cart-item-qty { display: flex; align-items: center; gap: 8px; }

  .cart-total {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 16px; padding-top: 14px;
    border-top: 2px solid var(--gold);
  }
  .cart-total-label { font-weight: 800; font-size: 16px; color: var(--brown-dark); }
  .cart-total-value { font-family: 'Playfair Display', serif; font-size: 22px; font-weight: 700; color: var(--gold); }

  .wa-btn {
    width: 100%; margin-top: 20px; padding: 16px; border-radius: 14px; border: none;
    background: var(--green-wa); color: #fff;
    font-family: 'Nunito', sans-serif; font-size: 16px; font-weight: 800;
    cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;
    transition: all 0.2s; box-shadow: 0 4px 16px rgba(37,211,102,0.35);
  }
  .wa-btn:hover { background: var(--green-wa-dark); transform: scale(1.02); }
  .wa-btn svg { width: 24px; height: 24px; fill: #fff; flex-shrink: 0; }

  .empty-cart { text-align: center; padding: 32px 0; color: var(--muted); font-size: 14px; }
  .empty-cart-icon { font-size: 40px; margin-bottom: 10px; }

  /* ── BOLOS ── */
  .bolo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .bolo-card {
    background: linear-gradient(135deg, var(--brown) 0%, var(--brown-dark) 100%);
    border-radius: var(--radius); padding: 14px;
    cursor: pointer; transition: all 0.2s;
    border: 1.5px solid transparent; position: relative; overflow: hidden;
  }
  .bolo-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); border-color: var(--gold); }
  .bolo-card.in-cart { border-color: var(--gold-light); }
  .bolo-icon { font-size: 28px; margin-bottom: 6px; }
  .bolo-name { font-family: 'Playfair Display', serif; font-size: 14px; font-weight: 700; color: #fff; margin-bottom: 2px; }
  .bolo-price { font-size: 13px; font-weight: 700; color: var(--gold-light); }
  .bolo-subtotal { font-size: 11px; font-weight: 700; color: var(--gold-light); opacity: 0.8; display: none; }
  .bolo-subtotal.show { display: block; }
  .bolo-add {
    position: absolute; top: 10px; right: 10px;
    width: 26px; height: 26px; border-radius: 50%; border: none;
    background: var(--gold); color: #fff; font-size: 18px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    font-weight: 700; transition: all 0.15s;
  }
  .bolo-add:hover { background: var(--gold-light); }
  .bolo-qty-row {
    display: none; align-items: center; gap: 6px; margin-top: 6px;
  }
  .bolo-qty-row.show { display: flex; }
  .bolo-qty-btn {
    width: 22px; height: 22px; border-radius: 50%;
    border: 1.5px solid var(--gold-light); background: transparent; color: var(--gold-light);
    font-size: 15px; font-weight: 700; cursor: pointer;
    display: flex; align-items: center; justify-content: center; transition: all 0.15s;
  }
  .bolo-qty-btn:hover { background: var(--gold); border-color: var(--gold); color: #fff; }
  .bolo-qty-num { font-size: 13px; font-weight: 800; color: #fff; min-width: 16px; text-align: center; }
</style>
</head>

<!-- HERO -->
<div class="hero">
  <div class="hero-badge">✦ Artesanal · Feito com amor ✦</div>
  <div class="hero-title">GICA</div>
  <div class="hero-sub">Sabores</div>

<!-- MODAL PRODUTO -->

        </div>
      </div>

  </div>
</div>

<!-- MODAL SACOLA -->

  { id:'f3', cat:'frango',    name:'Frango III',     desc:'Frango desfiado, milho, orégano e catupiry', price:28, emoji:'🍗' },

  { id:'e2', cat:'especiais', name:'Portuguesa',     desc:'Presunto, ovos, cebola, ervilha, orégano e mussarela', price:28, emoji:'🥖' },
  { id:'e3', cat:'especiais', name:'Frios',          desc:'Presunto, mortadela e mussarela', price:28, emoji:'🥖' },
  { id:'l1', cat:'lanches',   name:'Lanche de Frango', desc:'Patê de frango desfiado com maionese, cenoura, milho, tomate, alface e orégano', price:15, emoji:'🥪' },
  { id:'l2', cat:'lanches',   name:'Lanche de Frios',  desc:'Presunto, queijo mussarela com maionese, tomate e alface', price:15, emoji:'🥪' },
  { id:'b1', cat:'bolos', name:'Bolo de Limão',      desc:'Bolo artesanal de limão', price:30, emoji:'🍋' },
  { id:'b2', cat:'bolos', name:'Bolo de Morango',    desc:'Bolo artesanal de morango', price:30, emoji:'🍓' },
  { id:'b3', cat:'bolos', name:'Bolo de Laranja',    desc:'Bolo artesanal de laranja', price:30, emoji:'🍊' },
  { id:'b4', cat:'bolos', name:'Bolo de Uva',        desc:'Bolo artesanal de uva', price:30, emoji:'🍇' },
  { id:'b5', cat:'bolos', name:'Bolo de Maracujá',   desc:'Bolo artesanal de maracujá', price:30, emoji:'🌼' },
  { id:'b6', cat:'bolos', name:'Bolo de Chocolate',  desc:'Bolo artesanal de chocolate', price:30, emoji:'🍫' },
  { id:'b7', cat:'bolos', name:'Bolo de Côco',       desc:'Bolo artesanal de côco', price:30, emoji:'🥥' },
];

// ── CART ──
let cart = {};
let modalProduct = null;
let modalQty = 1;

const fmt = v => 'R$ ' + v.toFixed(2).replace('.', ',');

function getCartTotal() {
  return Object.entries(cart).reduce((sum, [id, qty]) => {
    const p = products.find(x => x.id === id);
    return sum + (p ? p.price * qty : 0);
  }, 0);
}
function getCartCount() {
  return Object.values(cart).reduce((a, b) => a + b, 0);
}

function updateCartUI() {
  const count = getCartCount();
  const total = getCartTotal();
  document.getElementById('cartCount').textContent = count;
  document.getElementById('cartFabTotal').textContent = fmt(total);
  const fab = document.getElementById('cartFab');
  count > 0 ? fab.classList.add('visible') : fab.classList.remove('visible');

  products.forEach(p => {
    const qty = cart[p.id] || 0;
    const card = document.getElementById('card-' + p.id);
    if (!card) return;
    qty > 0 ? card.classList.add('in-cart') : card.classList.remove('in-cart');

    if (p.cat === 'bolos') {
      // bolo controls
      const addBtn  = document.getElementById('badd-' + p.id);
      const qtyRow  = document.getElementById('bqrow-' + p.id);
      const qtyNum  = document.getElementById('bqnum-' + p.id);
      const subEl   = document.getElementById('bsub-' + p.id);
      if (qty > 0) {
        addBtn.style.display = 'none';
        qtyRow.classList.add('show');
        qtyNum.textContent = qty;
        subEl.textContent = fmt(p.price * qty);
        subEl.classList.add('show');
      } else {
        addBtn.style.display = 'flex';
        qtyRow.classList.remove('show');
        subEl.classList.remove('show');
      }
    } else {
      const addEl  = document.getElementById('add-' + p.id);
      const ctrlEl = document.getElementById('ctrl-' + p.id);
      const qtyEl  = document.getElementById('qty-' + p.id);
      const subEl  = document.getElementById('sub-' + p.id);
      if (qty > 0) {
        addEl.style.display = 'none';
        ctrlEl.style.display = 'flex';
        qtyEl.textContent = qty;
        subEl.textContent = fmt(p.price * qty);
        subEl.classList.add('show');
      } else {
        addEl.style.display = 'flex';
        ctrlEl.style.display = 'none';
        subEl.classList.remove('show');
      }
    }
  });
}

function setCartQty(id, qty) {
  if (qty <= 0) delete cart[id];
  else cart[id] = qty;
  updateCartUI();
}
function changeQty(id, delta) { setCartQty(id, (cart[id] || 0) + delta); }

// ── RENDER PRODUCTS ──
function renderProducts() {
  const cats = { calabresa:[], frango:[], especiais:[], lanches:[], bolos:[] };
  products.forEach(p => cats[p.cat].push(p));

  ['calabresa','frango','especiais','lanches'].forEach(cat => {
    document.getElementById('list-' + cat).innerHTML = cats[cat].map(p => `
      <div class="product-card" id="card-${p.id}" onclick="openProduct('${p.id}')">
        <div class="product-thumb">${p.emoji}</div>
        <div class="product-info">
          <div class="product-name">${p.name}</div>
          <div class="product-desc">${p.desc}</div>
          <div class="product-price-row">
            <div class="product-price">${fmt(p.price)}</div>
            <div class="product-subtotal" id="sub-${p.id}"></div>
          </div>
        </div>
        <div class="product-action" onclick="event.stopPropagation()">
          <button class="add-btn" id="add-${p.id}" onclick="setCartQty('${p.id}',1)">+</button>
          <div class="qty-controls" id="ctrl-${p.id}" style="display:none">
            <button class="qty-btn" onclick="changeQty('${p.id}',-1)">−</button>
            <span class="qty-num" id="qty-${p.id}">1</span>
            <button class="qty-btn" onclick="changeQty('${p.id}',1)">+</button>
          </div>
        </div>
      </div>
    `).join('');
  });

  document.getElementById('list-bolos').innerHTML = cats.bolos.map(p => `
    <div class="bolo-card" id="card-${p.id}" onclick="openProduct('${p.id}')">
      <button class="bolo-add" id="badd-${p.id}" onclick="event.stopPropagation();setCartQty('${p.id}',1)">+</button>
      <div class="bolo-icon">${p.emoji}</div>
      <div class="bolo-name">${p.name.replace('Bolo de ','')}</div>
      <div class="bolo-price">${fmt(p.price)}</div>
      <div class="bolo-subtotal" id="bsub-${p.id}"></div>
      <div class="bolo-qty-row" id="bqrow-${p.id}" onclick="event.stopPropagation()">
        <button class="bolo-qty-btn" onclick="changeQty('${p.id}',-1)">−</button>
        <span class="bolo-qty-num" id="bqnum-${p.id}">1</span>
        <button class="bolo-qty-btn" onclick="changeQty('${p.id}',1)">+</button>
      </div>
    </div>
  `).join('');
}

// ── MODAL PRODUTO ──
function openProduct(id) {
  const p = products.find(x => x.id === id);
  if (!p) return;
  modalProduct = p;
  modalQty = cart[p.id] || 1;
  document.getElementById('modalImg').textContent = p.emoji;
  document.getElementById('modalName').textContent = p.name;
  document.getElementById('modalDesc').textContent = p.desc;
  document.getElementById('modalPrice').textContent = fmt(p.price);
  updateModalSubtotal();
  document.getElementById('productModal').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function updateModalSubtotal() {
  const sub = document.getElementById('modalSubtotal');
  document.getElementById('modalQty').textContent = modalQty;
  if (modalProduct && modalQty > 1) {
    sub.textContent = 'Total: ' + fmt(modalProduct.price * modalQty);
    sub.classList.add('show');
  } else {
    sub.classList.remove('show');
  }
}

document.getElementById('modalMinus').onclick = () => { modalQty = Math.max(1, modalQty - 1); updateModalSubtotal(); };
document.getElementById('modalPlus').onclick  = () => { modalQty++; updateModalSubtotal(); };
document.getElementById('modalAddBtn').onclick = () => {
  if (!modalProduct) return;
  cart[modalProduct.id] = modalQty;
  updateCartUI();
  document.getElementById('productModal').classList.remove('open');
  document.body.style.overflow = '';
  const btn = document.getElementById('modalAddBtn');
  btn.textContent = '✓ Adicionado!';
  setTimeout(() => btn.innerHTML = '🛒 Adicionar', 1200);
};
document.getElementById('modalCloseBtn').onclick = () => {
  document.getElementById('productModal').classList.remove('open');
  document.body.style.overflow = '';
};
document.getElementById('productModal').onclick = e => {
  if (e.target === document.getElementById('productModal')) {
    document.getElementById('productModal').classList.remove('open');
    document.body.style.overflow = '';
  }
};

// ── CART MODAL ──
document.getElementById('cartFab').onclick = openCart;
document.getElementById('cartCloseBtn').onclick = () => {
  document.getElementById('cartModal').classList.remove('open');
  document.body.style.overflow = '';
};
document.getElementById('cartModal').onclick = e => {
  if (e.target === document.getElementById('cartModal')) {
    document.getElementById('cartModal').classList.remove('open');
    document.body.style.overflow = '';
  }
};

function openCart() {
  renderCart();
  document.getElementById('cartModal').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function renderCart() {
  const el = document.getElementById('cartItems');
  const items = Object.entries(cart).filter(([,qty]) => qty > 0);

  if (items.length === 0) {
    el.innerHTML = `<div class="empty-cart"><div class="empty-cart-icon">🛒</div>Sua sacola está vazia</div>`;
    document.getElementById('cartTotalRow').style.display = 'none';
    document.getElementById('waBtnMain').style.display = 'none';
    return;
  }

  el.innerHTML = items.map(([id, qty]) => {
    const p = products.find(x => x.id === id);
    if (!p) return '';
    return `
      <div class="cart-item">
        <div style="font-size:24px;flex-shrink:0">${p.emoji}</div>
        <div class="cart-item-info">
          <div class="cart-item-name">${p.name}</div>
          <div class="cart-item-sub">${fmt(p.price)} cada</div>
        </div>
        <div class="cart-item-qty">
          <button class="qty-btn" onclick="cartChange('${id}',-1)" style="width:26px;height:26px;font-size:16px">−</button>
          <span class="qty-num">${qty}</span>
          <button class="qty-btn" onclick="cartChange('${id}',1)" style="width:26px;height:26px;font-size:16px">+</button>
        </div>
        <div class="cart-item-price">${fmt(p.price * qty)}</div>
      </div>`;
  }).join('');

  const total = getCartTotal();
  document.getElementById('cartTotalVal').textContent = fmt(total);
  document.getElementById('cartTotalRow').style.display = 'flex';
  document.getElementById('waBtnMain').style.display = 'flex';
}

function cartChange(id, delta) {
  setCartQty(id, (cart[id] || 0) + delta);
  renderCart();
}

// ── WHATSAPP ──
document.getElementById('waBtnMain').onclick = () => {
  const items = Object.entries(cart).filter(([,qty]) => qty > 0);
  if (!items.length) return;
  let msg = 'Olá Gislayne, tudo bem? 😊\nGostaria de fazer um pedido:\n\n';
  let running = 0;
  items.forEach(([id, qty]) => {
    const p = products.find(x => x.id === id);
    if (!p) return;
    const subtotal = p.price * qty;
    running += subtotal;
    if (qty > 1) {
      msg += `• ${p.name}\n`;
      msg += `  ${qty} unidades x ${fmt(p.price)} = ${fmt(subtotal)}\n`;
    } else {
      msg += `• ${p.name} — ${fmt(subtotal)}\n`;
    }
    msg += `  Subtotal acumulado: ${fmt(running)}\n\n`;
  });
  msg += `*Total do pedido: ${fmt(getCartTotal())}* 🛒\n\nObrigado(a)! 🍞❤️`;
  window.open(`https://wa.me/${WHATSAPP}?text=${encodeURIComponent(msg)}`, '_blank');
};

// ── TABS ──
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const target = document.getElementById(btn.dataset.target);
    if (target) {
      const navH = document.getElementById('navTabs').offsetHeight;
      const top = target.getBoundingClientRect().top + window.scrollY - navH - 8;
      window.scrollTo({ top, behavior: 'smooth' });
    }
  });
});

// Highlight tab on scroll
const sections = ['sec-calabresa','sec-frango','sec-especiais','sec-lanches','sec-bolos'];
window.addEventListener('scroll', () => {
  const navH = document.getElementById('navTabs').offsetHeight;
  let current = sections[0];
  sections.forEach(id => {
    const el = document.getElementById(id);
    if (el && el.getBoundingClientRect().top <= navH + 20) current = id;
  });
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.target === current);
  });
}, { passive: true });

// ── INIT ──
renderProducts();
updateCartUI();
</script>
</body>
</html>
